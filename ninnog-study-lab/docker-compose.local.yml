services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ninnog
      MYSQL_USER: ninnog
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local-root-password}
    volumes:
      - ninnog_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ninnog -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: mysql://ninnog:${MYSQL_PASSWORD:-change-me-local-password}@db:3306/ninnog
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret-before-sharing}
      NODE_ENV: production
    ports:
      - "3000:3000"
volumes:
  ninnog_mysql:
